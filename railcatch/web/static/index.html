<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>railcatch — 예약대기 관리</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f6f7f9; --card:#fff; --fg:#16181d; --muted:#6b7280;
    --line:#e3e6ea; --accent:#2563eb; --ok:#15803d; --warn:#b45309; --err:#b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#171a21; --fg:#e6e8ec; --muted:#9aa1ac;
            --line:#262b34; --accent:#60a5fa; --ok:#4ade80; --warn:#fbbf24; --err:#f87171; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .wrap { max-width:940px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 14px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  input, select { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
                  background:var(--bg); color:var(--fg); font-size:14px; font-family:inherit; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  button { padding:9px 16px; border-radius:8px; border:1px solid transparent; cursor:pointer;
           font-size:14px; font-weight:600; font-family:inherit; background:var(--accent); color:#fff; }
  button.ghost { background:transparent; color:var(--muted); border-color:var(--line);
                 font-weight:500; padding:5px 11px; font-size:12px; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; letter-spacing:.04em; color:var(--muted);
       padding:0 8px 8px; font-weight:600; }
  td { padding:11px 8px; border-top:1px solid var(--line); vertical-align:middle; }
  .pill { display:inline-block; padding:2px 9px; border-radius:99px; font-size:11px; font-weight:700; }
  .planned    { background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn); }
  .registered { background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }
  .assigned   { background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok); }
  .done       { background:color-mix(in srgb, var(--muted) 20%, transparent); color:var(--muted); }
  .muted { color:var(--muted); font-size:12px; }
  .banner { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:13px; display:none; }
  .banner.err  { background:color-mix(in srgb, var(--err) 14%, transparent);  color:var(--err);  display:block; }
  .banner.warn { background:color-mix(in srgb, var(--warn) 14%, transparent); color:var(--warn); display:block; }
  .banner.info { background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent); display:block; }
  .empty { color:var(--muted); text-align:center; padding:28px 0; font-size:13px; }
  .swap { display:flex; align-items:flex-end; }
  .swap button { background:transparent; color:var(--muted); border:1px solid var(--line);
                 padding:9px 12px; font-size:15px; }
  .note { font-size:12px; color:var(--muted); margin-top:12px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>railcatch</h1>
  <p class="sub">코레일 예약대기 관리 &mdash; 걸어둘 열차를 정리하고, 배정·결제 기한을 놓치지 않게 알려줍니다.</p>

  <div id="banner" class="banner"></div>

  <div class="card">
    <h2>예약대기 추가</h2>
    <div class="grid">
      <div>
        <label for="dep">출발역</label>
        <select id="dep"></select>
      </div>
      <div class="swap"><button id="swap" title="출발/도착 바꾸기">⇄</button></div>
      <div>
        <label for="arr">도착역</label>
        <select id="arr"></select>
      </div>
      <div>
        <label for="day">날짜</label>
        <input id="day" type="date">
      </div>
      <div>
        <label for="time">출발 시각</label>
        <input id="time" type="time" value="08:00">
      </div>
      <div>
        <label for="ttype">열차 종류</label>
        <select id="ttype"></select>
      </div>
      <div>
        <label for="tnum">열차 번호 <span style="font-weight:400">(선택)</span></label>
        <input id="tnum" placeholder="101" autocomplete="off" inputmode="numeric">
      </div>
      <div>
        <label for="seat">좌석</label>
        <select id="seat"></select>
      </div>
    </div>
    <div class="row">
      <input id="note" placeholder="메모 (선택) — 예: 차선책" style="flex:1; min-width:180px">
      <button id="add">추가</button>
    </div>
    <p class="note">
      추가한 뒤 <strong>코레일+ 앱에서 직접 예약대기를 걸고</strong> 아래 목록에서 «대기 걸었음»을 눌러주세요.<br>
      이 프로그램은 코레일 서버에 아무 요청도 보내지 않습니다.
    </p>
  </div>

  <div class="card">
    <h2>목록</h2>
    <table>
      <thead><tr>
        <th style="width:38%">열차</th><th style="width:14%">상태</th>
        <th style="width:18%">출발까지</th><th style="width:30%">다음 할 일</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">추가된 항목이 없습니다.</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const STAGE_LABEL = { planned:"미등록", registered:"대기중", assigned:"배정됨", done:"완료" };
const NEXT_STEP = {
  planned:   "앱에서 예약대기를 거세요",
  registered:"배정되면 «배정됨»으로 바꾸세요",
  assigned:  "결제 기한 내에 결제하세요",
  done:      "—",
};

function banner(msg, kind) {
  const el = $("banner");
  if (!msg) { el.className = "banner"; el.textContent = ""; return; }
  el.className = "banner " + (kind || "err");
  el.textContent = msg;
}

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("요청 실패 (" + res.status + ")"));
  return data;
}

function post(path, body) {
  return api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
}

function options(list, selected) {
  return list.map(v => {
    const value = typeof v === "string" ? v : v.value;
    const label = typeof v === "string" ? v : v.label;
    return `<option value="${escapeHtml(value)}"${value === selected ? " selected" : ""}>` +
           `${escapeHtml(label)}</option>`;
  }).join("");
}

async function loadMeta() {
  const meta = await api("/api/meta");
  $("dep").innerHTML = options(meta.stations, "서울");
  $("arr").innerHTML = options(meta.stations, "부산");
  $("ttype").innerHTML = options(meta.train_types, "KTX");
  $("seat").innerHTML = options(meta.seat_classes, "any");
  $("day").value = meta.today;
  $("day").min = meta.today;
  if (!meta.telegram) {
    banner("텔레그램이 설정되지 않아 알림이 터미널 화면으로만 갑니다. " +
           ".env 의 TELEGRAM_TOKEN / TELEGRAM_CHAT_ID 를 채우면 휴대폰으로 받습니다.", "warn");
  }
}

function until(iso) {
  const diff = new Date(iso) - new Date();
  if (diff <= 0) return "출발함";
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor(diff / 3600000) % 24;
  const mins = Math.floor(diff / 60000) % 60;
  if (days) return `${days}일 ${hours}시간`;
  if (hours) return `${hours}시간 ${mins}분`;
  return `${mins}분`;
}

function actionsFor(e) {
  if (e.stage === "planned")
    return `<button class="ghost" data-stage="registered" data-id="${e.id}">대기 걸었음</button>`;
  if (e.stage === "registered")
    return `<button class="ghost" data-stage="assigned" data-id="${e.id}">배정됨</button>`;
  if (e.stage === "assigned")
    return `<button class="ghost" data-stage="done" data-id="${e.id}">결제 완료</button>`;
  return "";
}

function render(entries) {
  $("empty").style.display = entries.length ? "none" : "block";
  $("rows").innerHTML = entries.map(e => `<tr>
    <td>
      <div>${escapeHtml(e.train)} · ${escapeHtml(e.route)}</div>
      <div class="muted">${e.depart_at.slice(5,16).replace("T"," ")} · ${escapeHtml(seatLabel(e.seat_class))}
        ${e.note ? " · " + escapeHtml(e.note) : ""}</div>
    </td>
    <td><span class="pill ${e.stage}">${STAGE_LABEL[e.stage] || e.stage}</span></td>
    <td>${until(e.depart_at)}
      ${e.pay_deadline ? `<div class="muted">결제기한 ${e.pay_deadline.slice(5,16).replace("T"," ")}</div>` : ""}</td>
    <td>
      <div class="muted">${NEXT_STEP[e.stage] || ""}</div>
      <div style="margin-top:6px; display:flex; gap:6px">
        ${actionsFor(e)}
        <button class="ghost" data-remove="${e.id}">삭제</button>
      </div>
    </td>
  </tr>`).join("");
}

let SEAT_LABELS = {};
function seatLabel(v) { return SEAT_LABELS[v] || v; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

async function refresh() {
  try { render((await api("/api/waitlist")).entries); }
  catch (e) { banner("서버 연결 실패: " + e.message); }
}

$("swap").addEventListener("click", () => {
  const a = $("dep").value; $("dep").value = $("arr").value; $("arr").value = a;
});

$("add").addEventListener("click", async () => {
  const btn = $("add");
  btn.disabled = true;
  try {
    banner("");
    await post("/api/waitlist", {
      dep: $("dep").value,
      arr: $("arr").value,
      day: $("day").value,
      time: $("time").value,
      train_type: $("ttype").value,
      train_number: $("tnum").value,
      seat_class: $("seat").value,
      note: $("note").value,
    });
    $("tnum").value = ""; $("note").value = "";
    banner("추가했습니다. 이제 코레일+ 앱에서 예약대기를 걸어주세요.", "info");
    await refresh();
  } catch (e) { banner(e.message); }
  finally { btn.disabled = false; }
});

$("rows").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  try {
    if (btn.dataset.remove) {
      await post("/api/waitlist/remove", { id: btn.dataset.remove });
    } else if (btn.dataset.stage) {
      const body = { id: btn.dataset.id, stage: btn.dataset.stage };
      if (btn.dataset.stage === "assigned") {
        const t = prompt("결제 기한을 입력하세요 (예: 18:40). 모르면 비워두세요.");
        if (t) body.deadline = t.trim();
      }
      await post("/api/waitlist/stage", body);
    }
    await refresh();
  } catch (e) { banner(e.message); }
});

(async () => {
  try {
    const meta = await api("/api/meta");
    SEAT_LABELS = Object.fromEntries(meta.seat_classes.map(s => [s.value, s.label]));
    await loadMeta();
  } catch (e) { banner(e.message); }
  await refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
